<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web - Crear Cuenta</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page auth-page">
        <div class="brand">
            <h1> Registro</h1>
        </div>
        <section>
            <div class="card">
                <h2>Crear cuenta</h2>
                <div class="hint">Regístrate para acceder al sistema de estudiantes.</div>
                
                <form id="register-form">
                    <div class="row">
                        <label for="reg-name">Nombre Completo</label>
                        <input type="text" id="reg-name" placeholder="Ej. Juan Pérez" required>
                    </div>
                    <div class="row">
                        <label for="reg-email">Correo Electrónico</label>
                        <input type="email" id="reg-email" placeholder="correo@ejemplo.com" required>
                    </div>
                    <div class="row">
                        <label for="reg-password">Contraseña</label>
                        <input type="password" id="reg-password" placeholder="Mínimo 8 caracteres" required>
                    </div>
                    
                    <div class="actions">
                        <button class="btn-primary" type="submit">Registrarme</button>
                        <a class="btn-link" href="login.html">Ya tengo cuenta</a>
                    </div>
                    
                    <p id="mensaje" class="error" style="display: none;"></p>
                </form>
            </div>
        </section>
    </div>
    <script src="registro.js"></script>
</body>
</html>
